<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heavenly TZ</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#fff0f5;padding:10px}.card{background:#fff;padding:15px;border-radius:12px;margin:10px 0;box-shadow:0 2px 10px #0001}.blur{filter:blur(8px);user-select:none;background:#eee;padding:2px 8px;border-radius:5px}.btn{background:#e91e63;color:#fff;border:none;padding:12px;width:100%;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:8px}.btn-green{background:#25D366}input{width:100%;padding:12px;margin:5px 0;border:1px solid #ddd;border-radius:8px}.pay-box{border:2px dashed #e91e63;padding:15px;border-radius:10px;text-align:center;margin:10px 0}</style>
</head>
<body><div id="app"></div>
<script>
const PAY_NUMBER="0674429728";const WEEK=5000,MONTH=15000;let users=JSON.parse(localStorage.getItem('htz_users')||'[]');let currentUser=JSON.parse(localStorage.getItem('htz_current')||'null');let payments=JSON.parse(localStorage.getItem('htz_pay')||'{}');const isAdmin=location.search.includes('admin');function save(){localStorage.setItem('htz_users',JSON.stringify(users));localStorage.setItem('htz_current',JSON.stringify(currentUser));localStorage.setItem('htz_pay',JSON.stringify(payments));}
function render(){const app=document.getElementById('app');if(isAdmin){let html=`<div class="card"><h2>ADMIN</h2><p>${PAY_NUMBER}</p></div>`;users.forEach((u,i)=>{html+=`<div class="card"><b>${u.name}</b> - ${u.phone} - ${u.age}<br>${u.status}<br>Approved:${u.approved}<br><button class="btn" onclick="approve(${i})">APPROVE</button><button class="btn" style="background:#000" onclick="unlockUser('${u.phone}')">FUNGUA</button><button class="btn" style="background:red" onclick="del(${i})">FUTA</button></div>`;});app.innerHTML=html;return;}
if(!currentUser){app.innerHTML=`<div class="card"><h2>Heavenly TZ ❤️</h2><input id="r_name" placeholder="Jina"><input id="r_phone" placeholder="Namba 07.."><input id="r_age" placeholder="Umri"><input id="r_status" placeholder="Natafuta..."><button class="btn" onclick="register()">TUMA CODE</button><div id="codeBox" style="display:none"><p>CODE: <b id="codeShow"></b></p><input id="codeInput" placeholder="Code"><button class="btn btn-green" onclick="verify()">THIBITISHA</button></div></div>`;return;}
const hasPaid=payments[currentUser.phone]&&payments[currentUser.phone].exp>Date.now();let html=`<div class="card"><h3>${currentUser.name}</h3><button class="btn" style="background:#000" onclick="logout()">Toka</button></div>`;if(!hasPaid){html+=`<div class="pay-box"><h3>ONA NAMBA 🔒</h3><p>WEEK ${WEEK}/= MONTH ${MONTH}/=</p><p>Lipa ${PAY_NUMBER}</p><button class="btn btn-green" onclick="mockPay('week')">NIMELIPA 5K</button><button class="btn btn-green" onclick="mockPay('month')">NIMELIPA 15K</button></div>`;}else{html+=`<div class="card" style="background:#e8f5e9"><b>UmeLipa mpaka ${new Date(payments[currentUser.phone].exp).toLocaleDateString()}</b></div>`;}
html+=`<h3 style="margin:10px">Watu</h3>`;users.filter(u=>u.approved).forEach(u=>{const show=!hasPaid?`<span class="blur">${u.phone}</span> 🔒`:`<a href="tel:${u.phone}" style="color:green;font-weight:bold">${u.phone}</a>`;html+=`<div class="card"><b>${u.name}, ${u.age}</b><br>${u.status}<br>Namba: ${show}</div>`;});app.innerHTML=html;}
let tempUser,tempCode;function register(){const name=document.getElementById('r_name').value,phone=document.getElementById('r_phone').value,age=document.getElementById('r_age').value,status=document.getElementById('r_status').value;if(!name||!phone||!age)return alert('Jaza');tempCode=Math.floor(1000+Math.random()*9000);tempUser={name,phone,age,status,approved:false};document.getElementById('codeShow').innerText=tempCode;document.getElementById('codeBox').style.display='block';}
function verify(){if(document.getElementById('codeInput').value==tempCode){users.push(tempUser);currentUser=tempUser;save();render();}else alert('Code');}
function mockPay(type){const days=type==='week'?7:30;payments[currentUser.phone]={exp:Date.now()+days*24*3600*1000,type};save();render();}
function approve(i){users[i].approved=true;save();render();}function unlockUser(phone){payments[phone]={exp:Date.now()+30*24*3600*1000,type:'month'};save();render();}function del(i){users.splice(i,1);save();render();}function logout(){currentUser=null;save();render();}render();
</script></body></html>
