<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heavenly TZ</title>
<style>
body{margin:0;background:#070a18;color:#fff;font-family:system-ui}
header{background:#000;padding:12px;border-bottom:3px solid gold;display:flex;justify-content:space-between}
.w{max-width:420px;margin:auto;padding:12px}
.card{background:#fff;color:#000;border-radius:20px;overflow:hidden}
img{width:100%;height:520px;object-fit:cover;display:block}
.box{background:#141c36;padding:14px;border-radius:14px;margin-top:12px}
.input{width:100%;padding:12px;margin:6px 0;border-radius:10px;background:#080c1e;border:1px solid #334155;color:#fff;box-sizing:border-box}
.btn{width:100%;padding:12px;background:gold;color:#000;border:none;border-radius:99px;font-weight:900}
#adminPage{display:none}
</style>
</head>
<body>
<header><b style="color:gold">HEAVENLY TZ</b><span style="color:gold;font-size:11px">15K 0674429728</span></header>

<div id="adminPage" class="w">
<div class="box" style="border:2px solid gold">
<h2 style="color:gold">ADMIN</h2>
<input class="input" id="psw" type="password" placeholder="0674429728">
<button class="btn" onclick="check()">INGIA</button>
<div id="ad" style="display:none">
<div id="clist" style="background:#080c1e;padding:10px;border-radius:10px;margin:10px 0"></div>
<input class="input" id="cnum" placeholder="07xxxxxxxx">
<button class="btn" style="background:#22c55e;color:#fff" onclick="make()">TENGENEZA CODE</button>
<p id="cout" style="color:gold;margin-top:10px;font-weight:900"></p>
</div>
</div>
</div>

<div id="mainPage" class="w">
<div style="background:gold;color:#000;padding:10px;border-radius:10px;text-align:center;font-weight:900">LIPA 15K - 0674429728</div>
<div class="card">
<img id="pic" src="https://i.pravatar.cc/600?img=32" alt="">
<div style="padding:12px">
<h3 id="nm">Neema 24 Dar</h3>
<div id="info" style="background:#0f172a;color:#fff;padding:10px;border-radius:10px;margin-top:8px;font-size:13px">
<span id="phx" style="filter:blur(6px)">0712345678</span> | <span id="emx" style="filter:blur(6px)">neema@gmail.com</span>
</div>
</div>
<div style="display:flex;gap:8px;padding:10px;background:#f1f5f9">
<button class="btn" style="background:#cbd5e1" onclick="nextGirl()">SKIP</button>
<button class="btn" onclick="nextGirl()">LIKE</button>
</div>
</div>

<div class="box">
<div style="color:gold;text-align:center;font-size:28px;font-weight:900">0674429728</div>
<input class="input" id="myphone" placeholder="Namba yako 07xxxxxxxx">
<input class="input" id="mycode" placeholder="CODE TZ15K-xxxx">
<button class="btn" onclick="openPremium()">FUNGUA</button>
<p id="msg" style="text-align:center;margin-top:6px"></p>
</div>

<div class="box">
<input class="input" id="jina" placeholder="Jina">
<input class="input" id="simu" placeholder="Simu">
<button class="btn" onclick="saveClient()">JIUNGE BURE</button>
</div>

<a href="?admin" style="color:#334155;font-size:10px">?admin</a>
</div>

<script>
var girls=[
{n:"Neema 24 Dar",p:"0712345678",e:"neema@gmail.com",i:"https://i.pravatar.cc/600?img=32"},
{n:"Asha 23 Arusha",p:"0754123456",e:"asha@gmail.com",i:"https://i.pravatar.cc/600?img=26"},
{n:"Zawadi 25 Mwanza",p:"0765987321",e:"zawadi@gmail.com",i:"https://i.pravatar.cc/600?img=23"}
];
var idx=0;
function render(){
var g=girls[idx];
document.getElementById('pic').src=g.i;
document.getElementById('nm').innerText=g.n;
var prem=localStorage.getItem('hp')==='1';
document.getElementById('phx').innerText=g.p;
document.getElementById('emx').innerText=g.e;
document.getElementById('phx').style.filter=prem?'none':'blur(6px)';
document.getElementById('emx').style.filter=prem?'none':'blur(6px)';
}
function nextGirl(){idx=(idx+1)%girls.length;render();}
function openPremium(){
var v=document.getElementById('mycode').value.toUpperCase().trim();
var ph=document.getElementById('myphone').value.trim();
var a1="TZ15K-"+ph;
var a2="TZ15K-"+ph.slice(-4);
if(v===a1||v===a2||v==="TZ15K-0674429728"){
localStorage.setItem('hp','1');
document.getElementById('msg').innerText="IMEFUNGUKA";
document.getElementById('msg').style.color="#22c55e";
render();
}else{
document.getElementById('msg').innerText="CODE sahihi: "+a1;
document.getElementById('msg').style.color="#f87171";
}
}
function saveClient(){
var j=document.getElementById('jina').value;
var s=document.getElementById('simu').value;
var arr=JSON.parse(localStorage.getItem('cl')||'[]');
arr.push({j:j,s:s});
localStorage.setItem('cl',JSON.stringify(arr));
alert('OK');
}
function check(){
if(document.getElementById('psw').value==="0674429728"){
document.getElementById('ad').style.display="block";
var arr=JSON.parse(localStorage.getItem('cl')||'[]');
var h=arr.map(function(o){return o.j+": "+o.s}).join("<br>");
document.getElementById('clist').innerHTML=h||"Hakuna";
}
}
function make(){
var n=document.getElementById('cnum').value.trim();
var code="TZ15K-"+n;
var link="https://wa.me/"+n+"?text=CODE%20yako%20ni%20"+code;
document.getElementById('cout').innerHTML=code+"<br><a href='"+link+"' style='color:#25D366'>TUMA WHATSAPP</a>";
}
if(window.location.search.indexOf('admin')>-1){
document.getElementById('mainPage').style.display='none';
document.getElementById('adminPage').style.display='block';
}
render();
</script>
</body>
</html>
