<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heavenly</title>
<style>
:root{--blue:#0a1931;--gold:#d4af37}
body{margin:0;font-family:system-ui;background:#f5f7fb}
header{background:#0a1931;color:#fff;padding:18px;text-align:center;border-bottom:4px solid #d4af37}
header h1{margin:0;color:#d4af37}
.wrap{max-width:900px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 6px 20px rgba(0,0,0,.08);margin-bottom:16px;border-left:4px solid #d4af37}
input,select,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:6px 0 12px;box-sizing:border-box}
button{background:#0a1931;color:#fff;border:none;padding:12px 18px;border-radius:10px;font-weight:700;cursor:pointer}
button.gold{background:#d4af37;color:#0a1931}
.person{border:1px solid #eee;border-radius:14px;padding:12px;background:#fff}
.badge{display:inline-block;background:#0a1931;color:#d4af37;padding:4px 10px;border-radius:20px;font-size:12px}
.actions{display:flex;gap:8px;margin-top:10px}
.actions a{flex:1;text-align:center;text-decoration:none;padding:10px;border-radius:10px;font-weight:700}
.call{background:#0a1931;color:#fff}
.wa{background:#25D366;color:#fff}
</style>
</head>
<body>
<header><h1>HEAVENLY</h1><p>Tafuta mpenzi</p></header>
<div class="wrap">
<div class="card">
<input id="jina" placeholder="Jina">
<input id="umri" type="number" placeholder="Umri">
<select id="mkoa"><option value="">Mkoa</option><option>Arusha</option><option>Dar es Salaam</option><option>Dodoma</option><option>Mbeya</option><option>Mwanza</option><option>Kilimanjaro</option><option>Morogoro</option><option>Tanga</option><option>Geita</option><option>Kagera</option><option>Singida</option><option>Tabora</option><option>Shinyanga</option><option>Kigoma</option><option>Mara</option><option>Iringa</option><option>Ruvuma</option><option>Lindi</option><option>Mtwara</option><option>Pwani</option><option>Rukwa</option><option>Katavi</option><option>Simiyu</option><option>Manyara</option><option>Njombe</option><option>Songwe</option></select>
<input id="simi" type="tel" placeholder="07XXXXXXXX">
<textarea id="maelezo" placeholder="Maelezo"></textarea>
<input id="siri" placeholder="Siri">
<button class="gold" onclick="tangaza()" style="width:100%">TANGAZA</button>
</div>
<h2><span id="count">0</span> <button onclick="openAdmin()">⚙️</button></h2>
<div id="list" style="display:grid;gap:12px"></div>
<div id="adminPanel" style="display:none" class="card"><h3><span id="adminCount">0</span></h3><div id="adminList"></div><button onclick="futaWote()" style="background:#c0392b">FUTA</button> <button onclick="closeAdmin()">RUDI</button></div>
</div>
<script>
const KEY='heavenly_v3_direct';let watu=JSON.parse(localStorage.getItem(KEY)||'[]');
function save(){localStorage.setItem(KEY,JSON.stringify(watu));render()}
function tangaza(){const j=jina.value.trim(),u=umri.value.trim(),m=mkoa.value,s=simi.value.trim(),e=maelezo.value.trim(),si=siri.value.trim();if(!j||!u||!m||!s||!e){return}watu.unshift({id:Date.now(),jina:j,umri:u,mkoa:m,simi:s,maelezo:e,siri:si||''});jina.value=umri.value=simi.value=maelezo.value=siri.value='';mkoa.value='';save()}
function render(){count.innerText=watu.length;adminCount.innerText=watu.length;let h='',a='';watu.forEach(p=>{const wa=p.simi.replace(/[^0-9]/g,'').replace(/^0/,'255');h+=`<div class=person><h3>${p.jina} - ${p.umri}</h3><span class=badge>${p.mkoa}</span><p>${p.maelezo}</p><p><b>${p.simi}</b></p><div class=actions><a class=call href="tel:${p.simi}">PIGA</a><a class=wa href="https://wa.me/${wa}" target=_blank>WHATSAPP</a></div></div>`;a+=`<div style="border-bottom:1px solid #ddd;padding:6px 0"><b>${p.jina} | ${p.umri} | ${p.mkoa}</b><br>${p.maelezo}<br>${p.siri}<br>${p.simi}</div>`});list.innerHTML=h;adminList.innerHTML=a}
function openAdmin(){const p=prompt('');if(p==='Heavenly@2026'){adminPanel.style.display='block';render()}}
function closeAdmin(){adminPanel.style.display='none'}function futaWote(){if(confirm('')){watu=[];save()}}render();
</script>
</body>
</html>
