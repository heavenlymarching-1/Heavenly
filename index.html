<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>H</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#0f172a;color:#fff}
header{background:#fff;color:#000;padding:12px;display:flex;justify-content:space-between}
.wrap{max-width:380px;margin:auto;padding:12px}
.view{display:none}.view.active{display:block}
.card{background:#fff;color:#000;border-radius:18px;overflow:hidden}
.card img{width:100%;height:500px;object-fit:cover}
.info{padding:10px}.actions{display:flex;gap:8px;padding:10px}
.actions button{flex:1;padding:12px;border:none;border-radius:99px;font-weight:800}
.no{background:#e2e8f0}.yes{background:#22c55e;color:#fff}
.badge{background:#1e293b;color:#fff;padding:5px 8px;border-radius:99px;font-size:11px}
.top{display:flex;justify-content:space-between;margin-bottom:8px}
.box{background:#1e293b;padding:12px;border-radius:12px;margin-top:10px}
input{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#fff}
.btn{background:#FFD700;color:#000;padding:11px;border:none;border-radius:99px;width:100%;font-weight:800}
.m{display:flex;gap:8px;background:#1e293b;padding:8px;border-radius:10px;margin:5px 0}
.m img{width:44px;height:44px;border-radius:50%;object-fit:cover}
</style>
</head>
<body>
<header><b>H</b><div><button onclick="s('h')">H</button><button onclick="s('m')">M</button><button onclick="s('p')">P</button></div></header>
<div class="wrap">
<div id="h" class="view active">
<div class="top"><span class="badge" id="a"></span><span class="badge" id="b"></span></div>
<div class="card">
<img id="i" src="https://picsum.photos/seed/1/400/600">
<div class="info"><h3 id="n"></h3><p id="d" style="font-size:12px;color:#555"></p></div>
<div class="actions"><button class="no" onclick="x()">X</button><button class="yes" onclick="l()">♥</button></div>
</div>
</div>
<div id="m" class="view"><div id="ml"></div></div>
<div id="p" class="view">
<div class="box" style="border:1px solid #FFD700">
<h4>P - 15k / 30d</h4>
<p style="font-size:12px;margin:6px 0">100/d | boost</p>
<input id="c" placeholder="CODE">
<button class="btn" onclick="u()">OK</button>
</div>
</div>
</div>
<script>
const p=[{n:"Neema,24",d:"Dar",i:"https://picsum.photos/seed/1/400/600"},{n:"Asha,23",d:"Arusha",i:"https://picsum.photos/seed/2/400/600"},{n:"Zawadi,25",d:"Mwanza",i:"https://picsum.photos/seed/3/400/600"},{n:"Happy,22",d:"Dodoma",i:"https://picsum.photos/seed/4/400/600"}];
let k=0,ls=parseInt(localStorage.getItem('ls')||'5'),ld=localStorage.getItem('ld'),td=new Date().toDateString(),pr=localStorage.getItem('pr')=='true',pu=parseInt(localStorage.getItem('pu')||'0');
if(ld!=td){ls=pr?100:5;localStorage.setItem('ld',td);localStorage.setItem('ls',ls)}
if(Date.now()>pu&&pr){pr=false;localStorage.setItem('pr','false');ls=5}
function s(v){document.querySelectorAll('.view').forEach(e=>e.classList.remove('active'));document.getElementById(v).classList.add('active')}
function g(){a.innerText=ls;b.innerText=pr?"P":"F";n.innerText=p[k].n;d.innerText=p[k].d;i.src=p[k].i}
function x(){k=(k+1)%p.length;g()}
function l(){if(ls<=0){s('p');return}ls--;localStorage.setItem('ls',ls);let e=document.createElement('div');e.className='m';e.innerHTML=`<img src="${p[k].i}"><div><b>${p[k].n}</b></div>`;ml.appendChild(e);x()}
function u(){if(c.value.toUpperCase()=="P15"){pr=true;localStorage.setItem('pr','true');localStorage.setItem('pu',Date.now()+2592000000);ls=100;localStorage.setItem('ls',ls);s('h');g()}else{}}
g();
</script>
</body>
</html>
