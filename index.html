<body>
<div class="top"><b>HEAVENLY TZ</b><br><small>M-Pesa: 0674429728 | Single 5,000 | Monthly 15,000<br>crisantasherly@gmail.com</small></div>
<div class="month"><span id="mStatus">⏳ Huna Monthly Active</span><br><br><button class="btn-month" onclick="payMonthly()">👑 LIPA MONTHLY 15,000 - 0674429728</button><br><small style="color:#00bfff">Ukilipa unapata namba zote bure 30 days</small></div>

<script>
const SHEET_URL = "https://script.google.com/macros/s/PASTE_YOUR_LINK_HERE/exec";
const MY_PHONE = "0674429728";
const MY_PHONE_WA = "255674429728";
let unlocked = JSON.parse(localStorage.getItem("unlocked")||"[]");
function checkMonthly(){let exp=localStorage.getItem("monthly_expiry");if(exp&&Date.now()<parseInt(exp)){let d=Math.ceil((parseInt(exp)-Date.now())/86400000);document.getElementById("mStatus").innerHTML="✅ Monthly Active - Siku "+d;return true}return false}
let monthlyActive=checkMonthly();
async function jisajili(){if(umri.value<18){alert("18+");return}let data={jina:jina.value,umri:umri.value,mkoa:mkoa.value,whatsapp:whatsapp.value,bio:bio.value};document.body.innerHTML="<h2 style=text-align:center;color:#FFD700;margin-top:50px>Inatuma...</h2>";await fetch(SHEET_URL,{method:"POST",mode:"no-cors",body:JSON.stringify(data)});alert("Umefanikiwa!");location.reload()}
async function loadHalisi(){try{let r=await fetch(SHEET_URL);let watu=await r.json();watu.reverse();halisi.innerHTML=watu.map(w=>{let paid=monthlyActive||unlocked.includes(w.whatsapp);return `<div class="card"><div class="circle">${w.jina.substring(0,2).toUpperCase()}</div><b>${w.jina} - ${w.umri}</b><br><small style=color:#00bfff>${w.mkoa}</small><br><small>${w.bio||''}</small><br><br>${paid?`<b style=color:#FFD700>${w.whatsapp}</b><br><a href="https://wa.me/${w.whatsapp}"><button class="btn-wa">Chat</button></a>`:`<div class="blur">${w.whatsapp.substring(0,7)}XXXX</div><button class="btn-pay" onclick="paySingle('${w.whatsapp}')">🔓 5,000 - ${MY_PHONE}</button>`}</div>`}).join('')}catch(e){halisi.innerHTML="Weka LINK ya Sheet"}}
function paySingle(wa){let c=prompt(`Lipa 5000 kwa ${MY_PHONE}\nCODE: HEAVENLY${wa.slice(-4)}`);if(!c)return window.open(`https://wa.me/${MY_PHONE_WA}?text=NATAKA ${wa} 5k`);if(c.toUpperCase()==="HEAVENLY"+wa.slice(-4)){unlocked.push(wa);localStorage.setItem("unlocked",JSON.stringify(unlocked));location.reload()}}
function payMonthly(){let c=prompt(`Lipa 15000 kwa ${MY_PHONE}\nCODE: HEAVENLYMONTH`);if(!c)return window.open(`https://wa.me/${MY_PHONE_WA}?text=MONTHLY 15k`);if(c.toUpperCase().includes("HEAVENLYMONTH")){localStorage.setItem("monthly_expiry",Date.now()+2592000000);location.reload()}}
loadHalisi();
</script>
