<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HEAVENLY</title><style>body{margin:0;background:#050e2a;color:#fff;font-family:sans-serif}.top{background:linear-gradient(90deg,#0a2463,#d4af37);padding:22px;text-align:center;border-bottom:4px solid #d4af37}.box{max-width:460px;margin:auto;padding:10px}.card{background:#102a6b;border:2px solid #d4af37;border-radius:12px;padding:14px;margin:10px 0}.btn{width:100%;padding:13px;background:#d4af37;color:#050e2a;font-weight:900;border:none;border-radius:9px}input,textarea{width:100%;padding:11px;margin:6px 0;border-radius:8px;border:1px solid #d4af37;background:#061a3e;color:#fff;box-sizing:border-box}.hide{display:none!important}</style></head><body><div class="top"><h2 style="margin:0;color:#fff">HEAVENLY MARCHING TZ</h2><small style="color:#fff">BLUE & GOLD</small></div><div class="box"><div id="p1"><div class="card"><input id="jina" placeholder="Jina"><input id="umri" type="number" placeholder="Umri"><input id="mkoa" placeholder="Mkoa"><textarea id="maelezo" placeholder="Maelezo"></textarea><input id="siri" placeholder="Siri"><button class="btn" onclick="tuma()">TANGAZA</button></div><div class="card" style="text-align:center;background:linear-gradient(90deg,#0a2463,#d4af37)"><b>TIGO PESA: 0674429728</b></div><div id="list"></div></div><div id="p2" class="hide"><div class="card" style="text-align:center"><h3 style="color:#ffef8a">ADMIN</h3><input id="pass" type="password" placeholder="Password"><button class="btn" onclick="ingia()">INGIA</button><br><br><button class="btn" onclick="rudi()" style="background:#061a3e;color:#d4af37;border:1px solid #d4af37">RUDI</button></div><div id="aBox" class="hide"><div class="card" style="background:#d4af37;color:#050e2a"><b id="hesabu"></b><button onclick="futa()" style="float:right;background:#900;color:#fff;border:none;padding:5px 8px;border-radius:5px">FUTA</button></div><div id="alist"></div></div></div></div><button onclick="admin()" style="position:fixed;bottom:15px;right:15px;width:54px;height:54px;border-radius:50%;background:#d4af37;border:none">⚙️</button><script>let watu=[];try{watu=JSON.parse(localStorage.getItem("hm_final")||"[]")}catch(e){}function onyesha(){let L=document.getElementById("list");L.innerHTML="";watu.forEach(function(w){L.innerHTML+='<div class="card"><b style="color:#ffef8a">'+w.jina+' - '+w.umri+'</b> '+w.mkoa+'<br><small>'+w.maelezo+'</small></div>';});}function onyeshaA(){let L=document.getElementById("alist");L.innerHTML="";document.getElementById("hesabu").innerText="Watu: "+watu.length;watu.forEach(function(w){L.innerHTML+='<div class="card"><b>'+w.jina+' | '+w.umri+' | '+w.mkoa+'</b><br>'+w.maelezo+'<br><b style="color:#ffef8a">Siri: '+w.siri+'</b></div>';});}function tuma(){let j=document.getElementById("jina").value,u=document.getElementById("umri").value,m=document.getElementById("mkoa").value,d=document.getElementById("maelezo").value,s=document.getElementById("siri").value;if(!j||!u||!m){alert("Jaza jina, umri, mkoa");return;}watu.unshift({jina:j,umri:u,mkoa:m,maelezo:d,siri:s});localStorage.setItem("hm_final",JSON.stringify(watu));document.getElementById("jina").value="";document.getElementById("umri").value="";document.getElementById("mkoa").value="";document.getElementById("maelezo").value="";document.getElementById("siri").value="";onyesha();}function admin(){document.getElementById("p1").classList.add("hide");document.getElementById("p2").classList.remove("hide");}function rudi(){document.getElementById("p2").classList.add("hide");document.getElementById("p1").classList.remove("hide");document.getElementById("aBox").classList.add("hide");}function ingia(){if(document.getElementById("pass").value=="Heavenly@2026"){document.getElementById("aBox").classList.remove("hide");onyeshaA();}else{alert("Password si sahihi");}}function futa(){if(confirm("Futa wote?")){localStorage.removeItem("hm_final");watu=[];onyesha();onyeshaA();}}onyesha();</script></body></html>
