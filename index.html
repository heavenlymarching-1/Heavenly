<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heavenly Marching</title>
<style>
_{margin:0;padding:0;box-sizing:border-box}body{background:#0f172a;color:#fff;font-family:Arial;padding-bottom:80px}
.header{text-align:center;padding:22px 10px 10px}.halo{width:48px;height:12px;border:2px solid #c9a227;border-radius:50%;margin:0 auto 5px;box-shadow:0 0 10px #c9a227}
.header h1{color:#c9a227;letter-spacing:3px;line-height:1}.header h1 span{display:block;font-weight:300;font-size:16px;letter-spacing:6px}
.box{max-width:430px;margin:12px auto;background:#1e293b;padding:16px;border-radius:18px;border:1px solid #2a3655}
input,select,textarea{width:100%;padding:12px;margin:5px 0;background:#0f172a;border:1px solid #334155;border-radius:10px;color:#fff}
.btn{width:100%;padding:13px;border:none;border-radius:12px;font-weight:bold;cursor:pointer}.btn-gold{background:#fde68a;color:#000}.btn-outline{background:transparent;border:1.5px solid #fde68a;color:#fde68a}
.card{max-width:430px;margin:12px auto;background:#1e293b;border:1.5px solid #fde68a;border-radius:18px;padding:12px}
.card-top{display:flex;gap:10px;align-items:center}.avatar{width:74px;height:74px;border-radius:50%;object-fit:cover;border:2px solid #fde68a;background:#0f172a}.blur{filter:blur(6px)}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#0b1220;border-top:1px solid #1e293b;display:flex;justify-content:space-around;padding:8px 0;z-index:99}
.bottom div{text-align:center;font-size:11px;color:#64748b}.bottom http://div.active{color:#fde68a}.bottom div span{font-size:22px;display:block}
.admin-bar{position:fixed;bottom:78px;right:10px;background:#1e293b;padding:6px 12px;border-radius:20px;border:1px solid #c9a227;z-index:20;display:flex;gap:8px}
#adminPage{display:none;position:fixed;inset:0;background:#0f172a;z-index:999;padding:16px;overflow:auto}
</style>
</head>
<body>
<div class="header"><div class="halo"></div><h1>HEAVENLY<span>MARCHING</span></h1></div>
<div class="box">
<h3 style="border-bottom:3px solid #fde68a;display:inline-block">Tafuta Mpenzi</h3>
<div style="display:flex;gap:8px;margin-top:12px"><div style="width:80px"><b>Jinsia</b></div><select id="fJinsia"><option>Mwanamke • 21-30</option><option>Mwanaume</option><option>Mwanamke</option></select></div>
<div style="display:flex;gap:8px;margin-top:6px"><div style="width:80px"><b>Mahali</b></div><select id="fMkoa"><option value="">Tanzania</option><option>Dar es Salaam</option><option>Arusha</option><option>Mwanza</option><option>Dodoma</option></select></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px"><button class="btn btn-gold" onclick="tafuta()">TAFUTA</button><button class="btn btn-outline" onclick="wekaUpya()">WEKA UPYA</button></div>
<div style="margin-top:18px">
<input type="file" id="picha" accept="image/_">
<input id="jina" placeholder="Jina lako">
<input id="umri" type="number" placeholder="Umri">
<select id="mkoa"><option value="">Chagua Mkoa</option><option>Dar es Salaam</option><option>Arusha</option><option>Mwanza</option><option>Dodoma</option><option>Mbeya</option><option>Tanga</option><option>Zanzibar</option></select>
<input id="namba" placeholder="Namba yako 07...">
<textarea id="maelezo" placeholder="Maelezo..."></textarea>
<button class="btn btn-gold" style="margin-top:8px" onclick="tangaza()">TANGAZA SASA</button>
</div>
</div>
<div style="text-align:center;color:#475569;font-size:13px;margin-top:10px">✦ Matokeo <span id="count">0</span>+ • Watu Wapya Leo ✦</div>
<div id="list"></div>
<div class="admin-bar"><span id="count2" style="color:#c9a227;font-weight:bold">0</span><button style="background:#fde68a;border:none;padding:6px 10px;border-radius:10px;font-weight:bold" onclick="clickGear()">⚙️ ADMIN</button></div>
<div class="bottom">
<div class="active"><span>⭐</span>Nyumbani</div><div><span>💬</span>Ujumbe</div><div><span>❤️</span>Mechi</div><div onclick="clickGear()"><span>⚙️</span>Mipangilio</div><div><span>👤</span>Profili</div>
</div>
<div id="adminPage"><h2>Admin</h2><p id="adminInfo"></p><button class="btn btn-outline" style="margin:10px 0" onclick="closeAdmin()">Funga</button><div id="adminList"></div></div>
<script>
const ADMIN_PASSWORD="Heavenly0674!";
const watuMfano=[
{jina:"Aisha",umri:23,mkoa:"Dar es Salaam",namba:"07XXXXXXXX",maelezo:"Natafuta mwenza wa maisha mwenye heshima",pic:"https://i.pravatar.cc/150?img=5"},
{jina:"Kelvin",umri:26,mkoa:"Arusha",namba:"07XXXXXXXX",maelezo:"Mwanaume serious natafuta mchumba",pic:"https://i.pravatar.cc/150?img=8"},
{jina:"Neema",umri:22,mkoa:"Mwanza",namba:"07XXXXXXXX",maelezo:"Nipo tayari kwa mahusiano ya kweli",pic:"https://i.pravatar.cc/150?img=32"},
{jina:"Brian",umri:28,mkoa:"Dodoma",namba:"07XXXXXXXX",maelezo:"Nafanya biashara, natafuta mke",pic:"https://i.pravatar.cc/150?img=12"},
{jina:"Zuwena",umri:24,mkoa:"Tanga",namba:"07XXXXXXXX",maelezo:"Mrembo wa Tanga natafuta mpenzi",pic:"https://i.pravatar.cc/150?img=26"},
{jina:"David",umri:27,mkoa:"Mbeya",namba:"07XXXXXXXX",maelezo:"Mwalimu natafuta mwenzi",pic:"https://i.pravatar.cc/150?img=15"},
{jina:"Fatma",umri:21,mkoa:"Zanzibar",namba:"07XXXXXXXX",maelezo:"Nipo Zanzibar, natafuta urafiki wa kweli",pic:"https://i.pravatar.cc/150?img=16"},
{jina:"Sharon",umri:25,mkoa:"Dar es Salaam",namba:"07XXXXXXXX",maelezo:"Nafanya kazi bank, natafuta mwenza",pic:"https://i.pravatar.cc/150?img=23"},
{jina:"Musa",umri:30,mkoa:"Moshi",namba:"07XXXXXXXX",maelezo:"Mkristo, natafuta mchumba wa ndoa",pic:"https://i.pravatar.cc/150?img=53"},
{jina:"Lilian",umri:22,mkoa:"Arusha",namba:"07XXXXXXXX",maelezo:"Natafuta upendo wa kweli",pic:"https://i.pravatar.cc/150?img=29"}
];
let watu=JSON.parse(localStorage.getItem('watu_v3')||'null');
if(!watu || http://watu.length===0){watu=watuMfano;localStorage.setItem('watu_v3',JSON.stringify(watu));}
let clicks=0;let picBase64="";
http://document.getElementById('picha').addEventListener('change',e=>{let f=e.target.files;if(!f)return;let r=new FileReader();r.onload=()=>picBase64=r.result;r.readAsDataURL(f);});
function clickGear(){clicks++;setTimeout(()=>clicks=0,2000);if(clicks>=3){clicks=0;let p=prompt('Password:');if(p===ADMIN_PASSWORD){document.getElementById('adminPage').style.display='block';let h='';watu.forEach((w,i)=>{h+=`<div class="card"><div class="card-top"><img src="${w.pic}" class="avatar"><div><b>${w.jina}</b> ${w.namba}<br><small>${w.mkoa}</small></div></div><button class="btn btn-gold" style="background:#ef4444;color:#fff;margin-top:8px" onclick="futa(${i})">Futa</button></div>`});document.getElementById('adminList').innerHTML=h;document.getElementById('adminInfo').innerText='Watu: '+watu.length;}else if(p)alert('Sio sahihi');}}
function closeAdmin(){document.getElementById('adminPage').style.display='none'}
function futa(i){if(confirm('Futa?')){watu.splice(i,1);localStorage.setItem('watu_v3',JSON.stringify(watu));render();closeAdmin();}}
function render(fM=''){count.innerText=watu.length;count2.innerText=watu.length;let d=fM?watu.filter(w=>w.mkoa===fM):watu;let html='';d.slice().reverse().forEach(w=>{html+=`<div class="card"><div class="card-top"><img src="${w.pic||'https://ui-avatars.com/api/?name='+w.jina}" class="avatar"><div><b style="font-size:17px">${w.jina}, ${w.umri} • ${w.mkoa}</b><div style="font-size:13px;color:#cbd5e1;margin-top:2px">${w.maelezo}</div><div style="margin-top:5px"><span class="blur">Simu: ${w.namba}</span></div></div></div><button class="btn btn-gold" style="margin-top:10px" onclick="alert('Lipa 0674429728')">ONA NAMBA - LIPA 0674429728</button></div>`});list.innerHTML=html;}
function tangaza(){let j=jina.value.trim(),u=umri.value.trim(),mk=mkoa.value,n=namba.value.trim(),e=maelezo.value.trim();if(!j||!u||!n)return alert('Jaza Jina, Umri, Namba');watu.push({jina:j,umri:u,mkoa:mk||'Tanzania',namba:n,maelezo:e||'Natafuta mwenza...',pic:picBase64||`https://ui-avatars.com/api/?name=${encodeURIComponent(j)}&background=0f172a&color=fde68a`});localStorage.setItem('watu_v3',JSON.stringify(watu));jina.value='';umri.value='';namba.value='';maelezo.value='';picha.value='';picBase64='';render();alert('Umetangazwa!');}
function tafuta(){render(fMkoa.value)}function wekaUpya(){fMkoa.value='';render()}render();
</script>
</body>
