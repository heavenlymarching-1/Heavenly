<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTZ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0a0a0a;color:#fff}
header{padding:14px;text-align:center;position:sticky;top:0;z-index:10}
.h-user{background:#000;border-bottom:2px solid #ff2a6d}
.h-admin{background:#ff2a6d}
.wrap{max-width:500px;margin:auto;padding:8px}
.card{background:#1a1a1a;border:1px solid #222;border-radius:14px;padding:12px;margin:8px 0}
.card-a{background:#2a0a15;border:2px solid #ff2a6d;border-radius:14px;padding:12px;margin:8px 0}
input,select{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:1px solid #333;background:#000;color:#fff}
button{width:100%;padding:11px;border:none;border-radius:10px;background:#ff2a6d;color:#fff;font-weight:bold;margin-top:5px}
.btn2{background:#222}.btnG{background:#00c853}
.pill{background:#222;padding:3px 7px;border-radius:10px;font-size:11px;display:inline-block;margin:2px}
.blur{filter:blur(7px)}
.testi{display:flex;gap:8px;background:#111;padding:8px;border-radius:10px;margin:6px 0;border:1px solid #222}
.testi img{width:40px;height:40px;border-radius:50%}
</style>
</head>
<body>
<header id="hb"><div id="hi"></div></header>
<div class="wrap"><div id="app"></div></div>
<script>
const PH="0674429728", BEI=5000;
const T=[
{n:"B & N",t:"❤️",i:"https://randomuser.me/api/portraits/men/32.jpg"},
{n:"Juma 26",t:"✔️",i:"https://randomuser.me/api/portraits/men/45.jpg"},
{n:"Asha 23",t:"❤️",i:"https://randomuser.me/api/portraits/women/65.jpg"},
{n:"Kelvin",t:"💍",i:"https://randomuser.me/api/portraits/women/44.jpg"},
{n:"Mwajuma 24",t:"👍",i:"https://randomuser.me/api/portraits/women/68.jpg"},
{n:"Peter 29",t:"🔥",i:"https://randomuser.me/api/portraits/men/22.jpg"},
{n:"Rehema 21",t:"❤️",i:"https://randomuser.me/api/portraits/women/33.jpg"},
{n:"Frank 27",t:"⚡",i:"https://randomuser.me/api/portraits/men/75.jpg"},
{n:"Zainabu 25",t:"❤️",i:"https://randomuser.me/api/portraits/women/12.jpg"},
{n:"D & H",t:"👶",i:"https://randomuser.me/api/portraits/women/32.jpg"}
];
let ads=JSON.parse(localStorage.getItem("htz_ads")||"[]");
let paid=localStorage.getItem("htz_paid")==="yes";
function isA(){return location.search.includes("admin")}
function save(){localStorage.setItem("htz_ads",JSON.stringify(ads))}
function gen(){return "HTZ-"+Math.floor(1000+Math.random()*9000)}
function render(){
let hb=document.getElementById("hb"),hi=document.getElementById("hi"),app=document.getElementById("app");
if(isA()){
hb.className="h-admin";hi.innerHTML=`<h1>👑 ADMIN</h1><p style="font-size:11px">${ads.length} | ${PH}</p>`;
let h=`<div class="card-a" style="text-align:center">🔴 ADMIN TU</div>`;
ads.slice().reverse().forEach((a,ri)=>{let i=ads.length-1-ri;h+=`<div class="card-a"><b>👤 ${a.jina} ${a.umri}</b> ${a.jinsia} ${a.dini}<br><span class="pill">${a.mkoa}</span><span class="pill" style="background:#ff2a6d">${a.code}</span><div style="background:#000;padding:6px;border-radius:6px;margin:5px 0">📞 ${a.phone}</div><p style="font-size:12px">${a.maelezo}</p><button onclick="ads[${i}].paid=true;save();render()" class="btnG">✔️</button><button onclick="ads.splice(${i},1);save();render()" class="btn2">❌</button></div>`;});
h+=`<button onclick="location.href=location.pathname" class="btn2">⬅️</button>`;
app.innerHTML=h;return;
}
hb.className="h-user";hi.innerHTML=`<h1>❤️ HTZ</h1><p style="font-size:11px;color:#666">${ads.length} 🔥</p>`;
let list="";if(ads.length==0)list=`<div class="card">-</div>`;
ads.slice().reverse().forEach(a=>{list+=`<div class="card" style="border-left:3px solid #ff2a6d"><b>${a.jina} ${a.umri}</b> <span class="pill">${a.jinsia}</span><span class="pill">${a.dini}</span><span class="pill">${a.mkoa}</span><p style="margin:5px 0;font-size:13px">${a.maelezo}</p><div class="${paid?'':'blur'}" style="background:#000;padding:6px;border-radius:6px;text-align:center">📞 ${a.phone} | ${a.code}</div>${!paid?`<button onclick="show()">💳 ${BEI} | ${a.code}</button>`:`<button onclick="window.open('https://wa.me/255${a.phone.replace(/^0/,'')}','_blank')" class="btnG">💬</button>`}</div>`;});
let th="";T.forEach(x=>{th+=`<div class="testi"><img src="${x.i}"><div><b>${x.n}</b> ${x.t} ⭐⭐⭐⭐⭐</div></div>`;});
app.innerHTML=`<div class="card"><input id="j" placeholder="👤 Jina"><input id="u" type="number" placeholder="🎂 Umri"><select id="js"><option value="">⚧️</option><option>Mme</option><option>Mke</option></select><select id="d"><option value="">🙏 Dini</option><option>Mkristo</option><option>Muislmu</option><option>Mwingine</option></select><input id="m" placeholder="📍 Mkoa"><input id="ma" placeholder="💬 Jieleze"><input id="p" placeholder="📞 07..."><button onclick="post()">➕</button></div><div id="pay"></div>${list}<div style="margin-top:15px">${th}</div>`;
}
function post(){let j=document.getElementById("j").value.trim(),u=document.getElementById("u").value,js=document.getElementById("js").value,d=document.getElementById("d").value,m=document.getElementById("m").value.trim(),ma=document.getElementById("ma").value.trim(),p=document.getElementById("p").value.trim();if(!j||!u||!js||!d||!m||!ma||!p){return;}ads.push({jina:j,umri:u,jinsia:js,dini:d,mkoa:m,maelezo:ma,phone:p,code:gen()});save();render();}
function show(){document.getElementById("pay").innerHTML=`<div class="card" style="border:2px solid #ff2a6d;text-align:center">💳 ${BEI}<br><b>${PH}</b><br><input id="pc" placeholder="HTZ-"><button onclick="localStorage.setItem('htz_paid','yes');paid=true;render()">✔️</button></div>`;window.scrollTo(0,0);}
render();
</script>
</body>
</html>
