<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTZ - SITE TU 24/7</title>
<style>
_{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0a0a0a;color:#fff}
header{background:#000;border-bottom:2px solid #ff2a6d;padding:14px;text-align:center;position:sticky;top:0;z-index:10}
.wrap{max-width:500px;margin:auto;padding:8px}
.card{background:#1a1a1a;border:1px solid #222;border-radius:14px;padding:12px;margin:8px 0}
.pay{border:2px solid #ff2a6d;background:#2a0a15;border-radius:14px;padding:14px;margin:8px 0;text-align:center}
.sheria{border:2px solid #ff9800;background:#111;border-radius:12px;padding:12px;margin:8px 0}
input,select,textarea{width:100%;padding:12px;margin:5px 0;border-radius:8px;border:1px solid #333;background:#000;color:#fff}
button{width:100%;padding:13px;border:none;border-radius:12px;background:#ff2a6d;color:#fff;font-weight:bold;margin-top:6px}
.btnG{background:#00c853}.btn2{background:#222}.btnY{background:#ff9800}
.chat{max-height:180px;overflow:auto;background:#000;padding:8px;border-radius:8px;margin:6px 0}
.m{padding:6px 8px;border-radius:8px;margin:4px 0;max-width:85%;font-size:13px}
.me{background:#ff2a6d;margin-left:auto}.you{background:#222}
</style>
</head>
<body>
<header><h1>❤️ HTZ</h1><p><span id="cnt">0</span> | <span id="stat"></span></p></header>
<div class="wrap">
<div class="sheria">
<h3>📜 SHERIA 7</h3>
<div style="font-size:12px;line-height:1.6">
1. 🚫 HAKUNA SIMU<br>2. 💬 SITE TU<br>3. 💰 Tigo 0674429728 ya malipo tu<br>4. 🔑 CODE=namba moja<br>5. 🚫 BAN matusi<br>6. 📵 Hakuna kupiga<br>7. 🤝 Heshima
</div>
<label><input type="checkbox" id="kubali" style="width:auto"> ✅ Nimekubali</label>
</div>
<div class="card">
<input id="j" placeholder="Jina"><input id="u" type="number" placeholder="Umri"><select id="js"><option>Mme</option><option>Mke</option></select><input id="m" placeholder="Mkoa"><input id="ma" placeholder="Maelezo"><input id="p" placeholder="Namba yako siri"><button onclick="tuma()">TANGAZA</button>
</div>
<div id="paybox"></div>
<div id="list"></div>
<div class="card">
<h3>📩 MSAADA SITE TU</h3>
<textarea id="helpMsg" placeholder="Andika..."></textarea><button class="btn2" onclick="sendHelp()">TUMA</button><div id="helpBox" class="chat"></div>
</div>
</div>
<script>
const TIGO="0674429728";
let ads=JSON.parse(localStorage.getItem("htz_ads")||"[]");
let chats=JSON.parse(localStorage.getItem("htz_chats")||"{}");
let helps=JSON.parse(localStorage.getItem("htz_helps")||"[]");
let paidUntil=Number(localStorage.getItem("htz_until")||0);
let paidPhone=localStorage.getItem("htz_paid_phone")||"";
let CODES={"HTZ5000":7,"HTZ15000":30};
function isA(){return http://location.search.includes("admin")}
function save(){localStorage.setItem("htz_ads",JSON.stringify(ads))}
function saveChats(){localStorage.setItem("htz_chats",JSON.stringify(chats))}
function gen(){return "HTZ-"+Math.floor(1000+Math.random()_9000)}
function isPaid(){return http://Date.now() < paidUntil && http://document.getElementById("kubali")?.checked}
function dLeft(){return http://Math.ceil((paidUntil-Date.now())/86400000)}
function render(){
if(isA()){
let saved=JSON.parse(localStorage.getItem("htz_codes")||"{}");
let h=`<div class="card"><h2>ADMIN</h2><p>${TIGO}</p><input id="cPhone" placeholder="Namba"><input id="cCode" placeholder="CODE"><select id="cDays"><option value="7">7</option><option value="30">30</option></select><button onclick="mkCode()">TENGENEZA</button><div id="codes"></div><div class="chat">`+helps.map(x=>`<div class="m you">${x}</div>`).join("")+`</div></div>`;
http://ads.slice().reverse().forEach(a=>{h+=`<div class="card">${a.jina} ${a.code} ${a.phone}<br><button class="btn2" onclick="let c=prompt('Jibu');if(c){if(!chats['${a.code}'])chats['${a.code}']=[];chats['${a.code}'].push({txt:c,me:false});localStorage.setItem('htz_chats',JSON.stringify(chats));}">JIBU</button> <button class="btn2" onclick="ads=ads.filter(x=>x.code!='${a.code}');save();render()">FUTA</button><div class="chat">`+(chats[a.code]||[]).map(m=>`<div class="m ${m.me?'me':'you'}">${m.txt}</div>`).join("")+`</div></div>`});
http://document.getElementById("paybox").innerHTML="";document.getElementById("list").innerHTML=h;showCodes();return;
}
http://document.getElementById("cnt").innerText=ads.length;
http://document.getElementById("stat").innerText=isPaid()?dLeft()+" siku":"LOCK";
let pb="";
if(!isPaid()){
pb=`<div class="pay"><h3>LIPA</h3><p>${TIGO} Tigo Pesa</p><input id="pName" placeholder="Jina malipo"><input id="pPhone" placeholder="Namba malipo"><select id="pType"><option value="7">5000 WEEK</option><option value="30">15000 MONTH</option></select><button class="btnY" onclick="payNow()">NIMETUMA</button><input id="uCode" placeholder="CODE"><input id="uPhone" placeholder="Namba"><button class="btnG" onclick="unlock()">FUNGUA</button></div>`;
}else{
pb=`<div class="card" style="border-color:#00c853;background:#0a2a15;text-align:center">✅ ${paidPhone} - ${dLeft()} siku</div>`;
}
http://document.getElementById("paybox").innerHTML=pb;
let h2="";
http://ads.slice().reverse().forEach(a=>{
let btn=isPaid()?`<button class="btnG" onclick="openChat('${a.code}')">MESSAGE SITE</button>`:`<button class="btn2" onclick="document.getElementById('paybox').scrollIntoView()">LIPA</button>`;
h2+=`<div class="card"><b>${a.jina} ${a.umri}</b> ${a.jinsia} ${a.mkoa} ${a.code}<br>${a.maelezo}<br>${btn}<div id="chat-${a.code}" style="display:none"><div class="chat" id="box-${a.code}"></div><input id="inp-${a.code}" placeholder="Andika..."><button class="btn2" onclick="sendMsg('${a.code}')">TUMA</button></div></div>`;
});
http://document.getElementById("list").innerHTML=h2;
http://document.getElementById("helpBox").innerHTML=helps.map(x=>`<div class="m you">${x}</div>`).join("");
}
function payNow(){if(!document.getElementById("kubali").checked){alert("Kubali");return;}let name=document.getElementById("pName").value.trim(),phone=document.getElementById("pPhone").value.trim(),type=document.getElementById("pType").value;if(!name||!phone)return;helps.push(`MALIPO: ${name} | ${phone} | ${type} | ${new Date().toLocaleString()}`);localStorage.setItem("htz_helps",JSON.stringify(helps));render();}
function unlock(){if(!document.getElementById("kubali").checked)return;let code=document.getElementById("uCode").value.trim().toUpperCase(),phone=document.getElementById("uPhone").value.trim();if(!code||!phone)return;let saved=JSON.parse(localStorage.getItem("htz_codes")||"{}");let all={...CODES,...Object.fromEntries(Object.entries(saved).map(([k,v])=>[k,typeof v=='object'?v.days:v]))};let info=saved[code];if(!all[code] &&!info)return;if(info && http://info.phone && http://info.phone!=phone){alert(info.phone);return;}let days=info?info.days:all[code];localStorage.setItem("htz_until",Date.now()+days*86400000);localStorage.setItem("htz_paid_phone",phone);render();}
function openChat(code){if(!isPaid())return;document.getElementById("chat-"+code).style.display="block";renderChats(code);}
function renderChats(code){let box=document.getElementById("box-"+code);if(!box)return;box.innerHTML=(chats[code]||[]).map(m=>`<div class="m ${m.me?'me':'you'}">${m.txt}</div>`).join("");}
function sendMsg(code){let inp=document.getElementById("inp-"+code);if(!inp.value.trim())return;if(!chats[code])chats[code]=[];chats[code].push({txt:inp.value,me:true});saveChats();inp.value="";renderChats(code);}
function sendHelp(){let m=document.getElementById("helpMsg").value.trim();if(!m)return;helps.push(m);localStorage.setItem("htz_helps",JSON.stringify(helps));document.getElementById("helpMsg").value="";render();}
function mkCode(){let phone=document.getElementById("cPhone").value.trim(),code=document.getElementById("cCode").value.trim().toUpperCase(),days=Number(document.getElementById("cDays").value);if(!phone||!code)return;let saved=JSON.parse(localStorage.getItem("htz_codes")||"{}");saved[code]={phone:phone,days:days};localStorage.setItem("htz_codes",JSON.stringify(saved));showCodes();}
function showCodes(){let saved=JSON.parse(localStorage.getItem("htz_codes")||"{}");let d=document.getElementById("codes");if(!d)return;let h="";for(let k in saved){h+=`<div class="card">${k} -> ${saved[k].phone}</div>`}for(let k in CODES){h+=`<div class="card">${k} -> ${CODES[k]}</div>`}d.innerHTML=h;}
function tuma(){if(!document.getElementById("kubali").checked)return;let j=document.getElementById("j").value.trim(),u=document.getElementById("u").value.trim(),js=document.getElementById("js").value,m=document.getElementById("m").value.trim(),ma=document.getElementById("ma").value.trim(),p=document.getElementById("p").value.trim();if(!j||!p)return;ads.push({jina:j,umri:u||"-",jinsia:js,mkoa:m||"Dar",maelezo:ma||"-",phone:p,code:gen()});save();render();}
render();
</script>
</body>
</html>
